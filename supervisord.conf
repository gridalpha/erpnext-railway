; Runs the roles that upstream splits into separate containers. They share the
; sites directory — background jobs read the files the web tier wrote, and
; Railway volumes cannot be attached to more than one service — so they have to
; share a container here.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Without this, a process that exhausts its retries sits in FATAL forever while
; the container keeps reporting healthy. Bring the container down instead and
; let Railway's restart policy handle it.
[eventlistener:fatalexit]
command=/usr/local/bin/railway-fatal-exit.py
events=PROCESS_STATE_FATAL
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gunicorn]
command=/usr/local/bin/start.sh
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queue-short]
command=bench worker --queue short,default
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queue-long]
command=bench worker --queue long,default,short
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=bench schedule
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
